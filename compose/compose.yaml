services:
  seedfinder:
    image: toti330/dsp_seed_finder:0.7.0
    container_name: seedfinder
    environment:
      START_SEED: ${START_SEED:-0}
      END_SEED: ${END_SEED:-1000}
      NO_TUI: 1
      PG_USER: postgres
      PG_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PG_PORT: 5432
      PG_DBNAME: dsp
      PG_NETLOC: host.docker.internal
      LOG_LEVEL: ${LOG_LEVEL:-info}
    network_mode: bridge
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
