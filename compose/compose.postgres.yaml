version: "1"
services:
  seedfinder:
    image: toti330/seedfinder:0.2.0
    container_name: seedfinder
    environment:
      END_SEED: 100000 # max is 10,000,000 (10m)
      PG_USER: postgres
      PG_PASS: rootpassword # Default values
      PG_PORT: 5432
      PG_DBNAME: dsp
      PG_NETLOC: postgres
    restart: unless-stopped
  postgres:
    image: postgres:16
    container_name: postgres
    volumes:
      - "../data:/var/lib/postgresql/data"
    ports:
      - "5432:5432"