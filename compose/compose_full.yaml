services:
  postgres:
    image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: dsp
    volumes:
      - "../data:/var/lib/postgresql/data"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  seedfinder:
    image: toti330/dsp_seed_finder:0.7.0
    container_name: seedfinder
    environment:
      START_SEED: ${START_SEED:-0}
      END_SEED: ${END_SEED:-100}
      NO_TUI: 1
      PG_USER: postgres
      PG_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PG_PORT: 5432
      PG_DBNAME: dsp
      PG_NETLOC: postgres
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
  api:
    image: postgrest/postgrest:v12.2.12@sha256:5f4ce744539bbba786b4e24dbbd95bdb2a956dcf568c5374995a0ff4a68f5bd2
    container_name: api
    environment:
      PGRST_DB_URI: postgres://api_user:api_password@postgres:5432/dsp
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: api_user
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      seedfinder:
        condition: service_completed_successfully
