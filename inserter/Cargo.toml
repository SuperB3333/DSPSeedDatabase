[package]
name = "dsp_seed_finder"
version = "0.1.0"
edition = "2021"

[profile.release]
lto = true
opt-level = 3

[profile.dev]
incremental = true
debug = true

[[bin]]
name = "dsp_seed_finder"
path = "src/main.rs"


[dependencies]
once_cell = "1.19.0"
crossbeam-channel = "0.5.15"
postgres =  "0.19.13"
crossterm = "0.29.0"
anyhow = "1.0.103"
lazy_static = "1.5.0"
itertools = "0.15.0"

