<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSP Seed Finder - Rule Builder</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <h1>DSP Rule Builder</h1>
        <div class="toolbar">
            <button onclick="compileRuleset()">Compile Ruleset</button>
            <button onclick="clearAndReset()">Reset</button>
            <button onclick="call_api()">Start Request</button>
        </div>

        <div id="rule-tree-container"></div>

        <div class="output-container">
            <h2>Generated SQL</h2>
            <pre id="sql-output"></pre>
            <h2>Parameters</h2>
            <pre id="params-output"></pre>

            <h2>Results</h2>
            <div class="results-container">
                <h2>Status: </h2>
                <h2 id="status-str" style="color: #FF0000">not queried</h2>
            </div>
            <pre id="results-seeds" hidden></pre>
        </div>
    </div>
    <script src="js/rules.js"></script>
    <script src="js/metadata.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/api.js"></script>
</body>
</html>
